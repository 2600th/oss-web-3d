<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0d12" />
    <title>Safed Sagar — A Reconnaissance Flight Experience</title>
    <meta
      name="description"
      content="Fly a MiG-21 reconnaissance sortie through the high Himalayas. A fictional flight experience inspired by the courage of the Indian Armed Forces."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Cpath d='M16 4l2.1 12.2 9.9 3.6-9.9 1.3-1 8.9-1.1-8.9L4 19.8l9.9-3.6z' fill='%23e8eef6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui"></div>
    <div
      id="boot-status"
      role="alert"
      aria-live="assertive"
      hidden
      style="position:fixed;inset:0;z-index:10000;display:none;place-content:center;gap:1rem;padding:2rem;text-align:center;background:#05080cf2;color:#e8eef6;font:500 1rem/1.5 system-ui,sans-serif"
    >
      <p data-boot-message>The experience could not start.</p>
      <button type="button" onclick="location.reload()" style="margin:auto;padding:.7rem 1.2rem">Reload</button>
    </div>
    <noscript>
      <p class="noscript">This experience requires JavaScript and a WebGL2-capable browser.</p>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
